# The gate, in CI. It runs the repository's own `task check` rather than a copied step list, so a
# pull request and a laptop are judged by the same Taskfile and the two cannot drift
# (AGENTS.md § The gate).
#
# What differs from a laptop is the toolchain: `stable` here is whatever `stable` is on the day,
# and a newer clippy can fail a commit that passed locally — which is exactly what AGENTS.md § The
# gate warns about, and until this workflow existed nothing made that warning true. A second job
# builds on the declared `rust-version` (`Cargo.toml`, 1.98), because nothing else in the
# repository would notice that promise breaking.
#
# No credential step: every git dependency this workspace pins — `beyond10x/harness`,
# `beyond10x/aep`, and `beyond10x/entity-runtime` behind it — is a public repository, so the
# anonymous HTTPS fetch the runner's git performs is enough (`.cargo/config.toml`).
#
# Nothing paid runs here. `task check` is `cargo fmt --check`, `cargo clippy --workspace
# --all-targets -- -D warnings` and `cargo test --workspace`; the live runs sit behind
# `METAHARNESS_LIVE=1` and are never part of it (invariant 5).
name: Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # go-task 3.52.0 declares this exact minimum, so the setup version and the pinned task
          # runner below must move together.
          go-version: "1.25.10"
          # This repository has no Go module; setup-go's automatic cache looks for a go.sum at the
          # root and warns on every run. Rust's cache below is the one this gate relies on.
          cache: false

      - name: Install go-task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # `task check` needs `b10x-harness` where a run looks for it: the b10x adapter resolves the
      # binary when a run starts, even a scripted run that never launches it
      # (`tests/stream_closed.rs`, `every_harness_kind_closes_its_stream`), and it searches the
      # PATH it constructs for the child — `~/.local/bin:/usr/local/bin:/usr/bin:/bin`
      # (`crates/metaharness/src/builder.rs`) — not the runner's own. A laptop keeps the binary in
      # `~/.local/bin`; the runner gets it there, at the harness revision
      # `crates/metaharness-b10x/Cargo.toml` pins, so the two are judged alike.
      - name: Install b10x-harness into ~/.local/bin at the pinned harness revision
        run: |
          rev="$(grep -oE 'rev = "[0-9a-f]{40}"' crates/metaharness-b10x/Cargo.toml | head -1 | grep -oE '[0-9a-f]{40}')"
          test -n "$rev"
          cargo install --git https://github.com/beyond10x/harness --rev "$rev" --locked --root "$HOME/.local" b10x-harness-cli
          "$HOME/.local/bin/b10x-harness" --version

      # The gate's own exit status, never a pipeline's (AGENTS.md § The gate).
      - name: Run the repository gate
        run: task check

  msrv:
    name: MSRV 1.98
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # `rust-version = "1.98"` in Cargo.toml is a promise to anyone who embeds these crates; a
      # dependency raising its own MSRV is enough to break it silently.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.98"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build on the declared rust-version
        run: cargo build --workspace --locked
