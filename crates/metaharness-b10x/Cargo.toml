[package]
name = "metaharness-b10x"
description = "The b10x adapter: an agent loop we own, observed rather than driven"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
b10x-harness-catalogue = { git = "https://github.com/beyond10x/harness", rev = "684c99f5e8c7e1d22d7b29f717b71856db81766a" }
# The crate that defines the record this adapter reads. Taken for `micro_usd_as_decimal`, so the
# figure this seam puts on the wire is rendered by the same function that rendered it in the loop's
# own record — two spellings of one number is exactly the disagreement a cost figure must not have.
b10x-harness-loop = { git = "https://github.com/beyond10x/harness", rev = "684c99f5e8c7e1d22d7b29f717b71856db81766a" }
metaharness-protocol = { path = "../metaharness-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
clap = { workspace = true }
tempfile = { workspace = true }
