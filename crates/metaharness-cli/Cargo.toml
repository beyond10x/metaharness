[package]
name = "metaharness-cli"
description = "The metaharness binary: run a harness, stream events, accept steering."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "metaharness_cli"
path = "src/lib.rs"

[[bin]]
name = "metaharness"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
# The `clap` feature carries `RunSpec`'s own `derive(Args)` through, so the `run` verb's flags
# are the library's option struct and cannot drift from it (design D11).
metaharness = { path = "../metaharness", features = ["clap"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
