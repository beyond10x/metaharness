[package]
name = "metaharness"
description = "One interface to many agent harnesses: observable, steerable, hermetic."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The CLI's `run` verb is a `derive` on `RunSpec` and turns this on; a library embedder that
# only reads events does not link an argument parser to do it (design D11).
clap = ["metaharness-protocol/clap"]

[dependencies]
metaharness-protocol = { path = "../metaharness-protocol" }
metaharness-claude = { path = "../metaharness-claude" }
metaharness-codex = { path = "../metaharness-codex" }
# The loopback placeholder's nonce — see the workspace manifest for why it is not the clock.
getrandom = { workspace = true }
# The custody file lock (`flock`), so a run that dies holding it does not strand the next one.
rustix = { workspace = true }
# The loopback proxy's upstream leg, TLS on a blocking socket and no async runtime.
rustls = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
# rustls's trust anchors, compiled in rather than read from the platform store.
webpki-roots = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
