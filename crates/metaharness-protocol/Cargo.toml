[package]
name = "metaharness-protocol"
description = "The harness-neutral wire: events a run emits, commands that steer it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# `RunSpec` carries `#[derive(clap::Args)]` behind this feature and not unconditionally, so a
# library embedder does not link an argument parser to read an event (design D11).
clap = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
