[package]
name = "metaharness-tools"
description = "The owned tool surface, served to a vendor harness over MCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The first dependency this workspace has on another repository, and it is deliberate. The
# alternative was a second implementation of read, write, edit, list, search and a bounded `run` —
# and with it a second path-containment check, which is the one thing in either tree that must not
# exist twice. `b10x-harness-tools` depends on `b10x-harness-wire`, serde and nothing else: no
# substrate, no async runtime, no filesystem beyond `std`. That is what makes it importable here.
#
# Pinned by git revision, never by `path`: a path into a sibling checkout builds against whatever
# is checked out there, and `--locked` cannot lock it (AGENTS.md invariant 10; the same rule
# harness holds for substrate). The revision is the released harness 0.12.1 commit `90f10a4`,
# 2026-09-11 — the execution-context boundary plus the loop records this adapter reads.
b10x-harness-tools = { git = "https://github.com/beyond10x/harness", rev = "90f10a4314c1c630691c85e812bd8d5d23d73fcc" }
b10x-harness-wire = { git = "https://github.com/beyond10x/harness", rev = "90f10a4314c1c630691c85e812bd8d5d23d73fcc" }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
