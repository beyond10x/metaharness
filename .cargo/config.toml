# Fetch git dependencies with the system `git`, not cargo's built-in client.
#
# The git dependencies — `beyond10x/harness`, pinned by revision in
# `crates/metaharness-tools/Cargo.toml` and `crates/metaharness-b10x/Cargo.toml` — live in a
# private repository. The credential that reaches it belongs to the system git: the SSH agent and
# `url.<base>.insteadOf` on a developer machine, a token-bearing `insteadOf` in CI. Cargo's own
# fetcher honours neither, and fails with an authentication error that names nothing.
[net]
git-fetch-with-cli = true
