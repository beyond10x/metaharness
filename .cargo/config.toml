# Fetch git dependencies with the system `git`, not cargo's built-in client.
#
# The setting stays because it is the machine's git configuration that decides how git URLs are
# reached: an `url.<base>.insteadOf` rewrite, an SSH remote, a proxy, or a token-bearing rewrite in
# a job that also builds a private sibling. Cargo's own fetcher honours none of them and fails with
# an authentication error that names nothing. Dropping it is safe only once nothing that builds this
# workspace relies on such a rewrite.
[net]
git-fetch-with-cli = true
