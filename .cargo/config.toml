# Fetch git dependencies with the system `git`, not cargo's built-in client.
#
# This was added when `beyond10x/harness` was private. It is not any more: on 2026-09-15
# `gh repo view --json visibility` reported PUBLIC for every repository this workspace fetches from
# — `beyond10x/harness` (pinned by revision in `crates/metaharness-tools/Cargo.toml` and
# `crates/metaharness-b10x/Cargo.toml`), `beyond10x/aep` (`crates/metaharness-aep/Cargo.toml`) and
# `beyond10x/entity-runtime`, which arrives through AEP. An anonymous HTTPS fetch reaches all three,
# so no credential is required to build this workspace today.
#
# The setting stays because it is the machine's git configuration that decides how those URLs are
# reached: an `url.<base>.insteadOf` rewrite, an SSH remote, a proxy, or a token-bearing rewrite in
# a job that also builds a private sibling. Cargo's own fetcher honours none of them and fails with
# an authentication error that names nothing. Dropping it is safe only once nothing that builds this
# workspace relies on such a rewrite.
[net]
git-fetch-with-cli = true
