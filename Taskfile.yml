version: "3"

tasks:
  check:
    desc: The full gate — format, lint, test. Green before any push.
    cmds:
      - ess specify validate --path spec --strict-requires
      - ess specify validate --path spec/monetary --strict-requires
      - cargo fmt --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo test --workspace
      - cargo run --locked --quiet -p metaharness-docs -- check

  fmt:
    desc: Format the workspace.
    cmds:
      - cargo fmt

  docs:
    desc: Validate and build the independent public documentation.
    cmds:
      - task: docs:build

  docs:build:
    desc: Build the documentation site. A broken link fails the build.
    cmds:
      - cargo run --locked -p metaharness-docs -- build --out website/build --commit "$(git rev-parse HEAD)"
