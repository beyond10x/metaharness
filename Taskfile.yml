version: "3"

tasks:
  check:
    desc: The full gate — format, lint, test. Green before any push.
    cmds:
      - ess specify validate --path spec --strict-requires
      - ess specify validate --path spec/monetary --strict-requires
      - cargo fmt --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo test --workspace

  fmt:
    desc: Format the workspace.
    cmds:
      - cargo fmt

  docs:
    desc: The public documentation site, in dev mode with hot reload.
    dir: website
    cmds:
      - npm start

  docs:build:
    desc: Build the documentation site. A broken link fails the build.
    dir: website
    cmds:
      - npm ci
      - npm run build
