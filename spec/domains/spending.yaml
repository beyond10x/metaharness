domain: metaharness.spending
summary: Local finite spend terms and ledger, with explicitly proposed uncapped policy types.
# RETROFIT authority: crates/metaharness-aep/src/drive.rs:154-279,1594-1638,
# 1654-1699 and the pre-spawn reserve at :500-518. No upstream AEP workflow,
# iteration/retry limits or worktree/substrate lifecycle is redeclared here.
types:
  - name: metaharness.spending.FiniteTerms
    kind: struct
    fields:
      - {name: cap_micro_usd, type: Integer}
      - {name: assumed_micro_usd_per_run, type: Integer}
  - name: metaharness.spending.SpendLedger
    kind: struct
    fields:
      - {name: format, type: String}
      - {name: spent_micro_usd, type: Integer}
      - {name: launches, type: Integer}
    invariants: [spent_micro_usd >= 0, launches >= 0]
    # The existing aep.drive-spend/1 calls reservations "spent_micro_usd".
    # They are assumed charges, not observed monetary cost (drive.rs:235-251).
  - name: metaharness.spending.UncappedTerms
    kind: struct
    fields:
      - {name: authorization_ref, type: String}
    # PROPOSED issue 14: an explicit durable operator reference; no cap or
    # invented assumed charge. The runtime does not implement this type yet.
  - name: metaharness.spending.Policy
    kind: union
    tag: mode
    variants:
      finite: metaharness.spending.FiniteTerms
      uncapped: metaharness.spending.UncappedTerms
    # PROPOSED discriminated policy; not a claim about a released wire format.
  - name: metaharness.spending.InvocationAdmission
    kind: struct
    fields:
      - {name: launches, type: Integer}
      - {name: authorization_ref, type: String}
    # UNMAPPED: observed monetary values are declared exactly in the separately
    # validated monetary contract; the core projection excludes the value while
    # ESS 0.51.0 refuses Binary64 conformance codecs and Rust synthesis.
    invariants: [launches > 0]
    # PROPOSED: durable invocation count precedes spawn. Observations stay absent
    # when the vendor reports no cost; this is not a zero-cost declaration.

errors:
  - name: metaharness.spending.InvalidFiniteTerms
    fields: []
  - name: metaharness.spending.UncappedAuthorizationRequired
    fields: []

commands:
  - name: metaharness.spending.CheckFiniteTerms
    # Retrofit the positive finite cap and assumed-charge relation.
    input:
      - {name: terms, type: metaharness.spending.FiniteTerms}
    outcomes:
      - name: valid-finite-terms
        when:
          all:
            - terms.cap_micro_usd > 0
            - terms.assumed_micro_usd_per_run > 0
            - terms.assumed_micro_usd_per_run <= terms.cap_micro_usd
        accepts: nothing
      - name: invalid-finite-terms
        error: metaharness.spending.InvalidFiniteTerms
    # UNMAPPED: Integer is unbounded; the implementation uses u64 and checked
    # addition/multiplication. Overflow, exact decimal parsing and ledger
    # consistency need production money/reservation tests, not float arithmetic.
    # UNMAPPED: METAHARNESS_LIVE=1, missing flags and model-free maps are outer
    # admission rules in spend_terms_with_live; this command receives parsed terms.

  - name: metaharness.spending.CheckUncappedAuthorization
    # PROPOSED issue 14; explicit opt-in plus a nonempty durable authorization reference.
    input:
      - {name: explicit_opt_in, type: Boolean}
      - {name: authorization_ref, type: String}
    outcomes:
      - name: explicitly-authorized
        when: {all: [explicit_opt_in == true, authorization_ref.count > 0]}
        accepts: nothing
      - name: unauthorized
        error: metaharness.spending.UncappedAuthorizationRequired
    # UNMAPPED: nonempty syntax is not proof of authorization. The implementation
    # must persist the operator's declared reference and policy before allocation/
    # spawn; the proposal does not invent an external authorization service.
    # UNMAPPED: reservation-before-spawn, atomic persistence failure, invocation
    # overflow and crash/resume consistency are ordered I/O behavior. The target
    # must drive real SpendBudget and the proposed uncapped admission implementation.
    # UNMAPPED: resume must preserve mode/reference and forbid implicit finite to
    # uncapped widening. Whether an explicit uncapped-to-finite narrowing is allowed
    # is an open policy decision; this draft grants no such transition.
