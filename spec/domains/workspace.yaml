domain: metaharness.workspace
summary: Existing selected-directory naming admission, without owning worktree or substrate lifecycle.
# Source authority: pinned Harness 90f10a4314c1c630691c85e812bd8d5d23d73fcc,
# crates/harness-substrate/src/embedded.rs:213-250. Metaharness's old prefix
# predicate at crates/metaharness/src/builder.rs:1784 and
# crates/metaharness-aep/src/drive.rs:2425 contradicts that dependency.
# The repair is specified by design amendment a18 dated 2026-10-03.
types:
  - name: metaharness.workspace.WorkspaceName
    kind: newtype
    of: String
    alphabet: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-"
  - name: metaharness.workspace.WorkspaceSelection
    kind: struct
    fields:
      - {name: requested_path, type: String}
      - {name: canonical_path, type: String}
      - {name: name, type: metaharness.workspace.WorkspaceName}
    # A projection of explicit cwd/project selection, not a new durable owner.
  - name: metaharness.workspace.ProcessWriteSubtree
    kind: newtype
    of: String
    # Explicit workspace-relative directory, not a file-tool glob. Validation
    # must agree with the selected native substrate contract; syntax alone
    # establishes no mount or containment observation.
  - name: metaharness.workspace.ProcessWriteDeclaration
    kind: struct
    fields:
      - {name: directories, type: "List<metaharness.workspace.ProcessWriteSubtree>"}
    # Draft typed home for issue21 before its AEP story. Empty means the native
    # subprocess workspace stays read-only. Never derive entries from write_scope.
    # The planned conformance operations must exercise production validation and
    # argv forwarding; actual containment is a separate native regression.

  - name: metaharness.workspace.ProcessWriteProbe
    kind: enum
    variants: [empty, explicit, invalid, file-scope-only]

  - name: metaharness.workspace.ScratchCwdProbe
    kind: enum
    variants: [declared, declared-under-memory, named-only, undirected]
    # declared: --cwd <copy> --scratch-cwd over a directory the test made, nothing
    # above it. declared-under-memory: the same with an AGENTS.md one level above
    # the copy. named-only: --cwd <copy> without the declaration (amendment a6).
    # undirected: --scratch-cwd without --cwd.
  - name: metaharness.workspace.CwdAttestation
    kind: enum
    variants: [declared, unavailable]
    # The H7 state read off session.started's attestation: declared (a27) or
    # unavailable (a6). imposed is the scratch-cwd case this command never runs.
  - name: metaharness.workspace.ContextFileProbe
    kind: enum
    variants: [tracked, undirected, empty-path, absolute, climbing, non-utf8-path, symlink, irregular, absent, not-text, untracked, over-count, over-bytes]

errors:
  - name: metaharness.workspace.InvalidName
    fields: []
  - name: metaharness.workspace.DeclarationWithoutDirectory
    fields: []
  - name: metaharness.workspace.ContextWithoutDirectory
    fields: []
  - name: metaharness.workspace.ContextPathAbsolute
    fields: []
  - name: metaharness.workspace.ContextPathEscapes
    fields: []
  - name: metaharness.workspace.ContextSymlink
    fields: []
  - name: metaharness.workspace.ContextNotRegularFile
    fields: []
  - name: metaharness.workspace.ContextUntracked
    fields: []
  - name: metaharness.workspace.ContextCountCap
    fields: []
  - name: metaharness.workspace.ContextByteCap
    fields: []
  - name: metaharness.workspace.ContextPathEmpty
    fields: []
  - name: metaharness.workspace.ContextPathNotUtf8
    fields: []
  - name: metaharness.workspace.ContextUnreadable
    fields: []
  - name: metaharness.workspace.ContextNotText
    fields: []

commands:
  - name: metaharness.workspace.CheckSelectedName
    # Check the component of an explicitly selected canonical directory.
    input:
      - {name: name, type: metaharness.workspace.WorkspaceName}
    outcomes:
      - name: invalid-name-refused
        when:
          any:
            - name.count == 0
            - {name: {starts_with: "-"}}
        error: metaharness.workspace.InvalidName
      - name: eligible-component
        accepts: nothing
    # Invalid characters (including . and ..) are rejected by WorkspaceName's
    # alphabet, not accepted and converted into another name.
    # UNMAPPED: a name alone proves no filesystem identity or confinement.
    # A real target must canonicalize --project . / --cwd, reject absent paths,
    # exercise substrate's pinned-root/symlink containment, and preserve managed
    # worktree path, git identity and leases. See builder.rs:492-515,1730-1743;
    # drive.rs:1875-1910,2339-2354 and the pinned workspace_adopt implementation.
    # UNMAPPED: when mutation requires confinement, missing confinement is refused;
    # syntax admission cannot substitute for the actual driver's decision.

  - name: metaharness.workspace.DeclareProcessWrites
    # A bounded conformance projection through public builder and native argv.
    # Filesystem mounts are validated by the native host, not by this command.
    input: [{name: probe, type: metaharness.workspace.ProcessWriteProbe}]
    outcomes:
      - name: process-read-only-default
        when: probe == empty
        emits: [metaharness.workspace.ProcessWritePlanned]
        payload: {metaharness.workspace.ProcessWritePlanned: {admitted: true, count: 0}}
      - name: process-explicit-subtrees
        when: probe == explicit
        emits: [metaharness.workspace.ProcessWritePlanned]
        payload: {metaharness.workspace.ProcessWritePlanned: {admitted: true, count: 2}}
      - name: process-invalid-directory
        when: probe == invalid
        emits: [metaharness.workspace.ProcessWritePlanned]
        payload: {metaharness.workspace.ProcessWritePlanned: {admitted: false, count: 0}}
      - name: file-scope-is-not-process-scope
        emits: [metaharness.workspace.ProcessWritePlanned]
        payload: {metaharness.workspace.ProcessWritePlanned: {admitted: true, count: 0}}

  - name: metaharness.workspace.DeclareScratchWorkingDirectory
    # Design amendment a27. Each outcome is a real `--hermetic strict` Claude run over
    # ScriptedRunner in a directory the target made; the H7 state and H11 verdict are
    # read off session.started's attestation and the exit code off the production
    # floor. No vendor process or model starts. The exit is 1 after the run, never a
    # pre-spawn refusal: a memory file above the copy is the embedder's placement,
    # measured and reported, not metaharness failing to do its job.
    input: [{name: probe, type: metaharness.workspace.ScratchCwdProbe}]
    outcomes:
      - name: declaration-without-directory
        when: probe == undirected
        error: metaharness.workspace.DeclarationWithoutDirectory
      - name: strict-admits-the-declared-copy
        when: probe == declared
        emits: [metaharness.workspace.ScratchCwdAttested]
        payload: {metaharness.workspace.ScratchCwdAttested: {h7: declared, h11_imposed: true, exit_code: 0}}
      - name: memory-above-the-copy-fails-strict
        when: probe == declared-under-memory
        emits: [metaharness.workspace.ScratchCwdAttested]
        payload: {metaharness.workspace.ScratchCwdAttested: {h7: declared, h11_imposed: false, exit_code: 1}}
      - name: named-without-declaration-keeps-a6
        emits: [metaharness.workspace.ScratchCwdAttested]
        payload: {metaharness.workspace.ScratchCwdAttested: {h7: unavailable, h11_imposed: false, exit_code: 1}}
    # UNMAPPED: the declaration confines nothing; the copy's fences are
    # story:confinement-of-vendor-kinds. Making the copy is the embedder's.

  - name: metaharness.workspace.DeclareContextFiles
    input: [{name: probe, type: metaharness.workspace.ContextFileProbe}]
    outcomes:
      - name: context-without-cwd
        when: probe == undirected
        error: metaharness.workspace.ContextWithoutDirectory
        summary: A context file is read from the --cwd tree, so a run naming none is refused before the spawn on every kind (a35).
      - name: absolute-path-refused
        when: probe == absolute
        error: metaharness.workspace.ContextPathAbsolute
      - name: climbing-path-refused
        when: probe == climbing
        error: metaharness.workspace.ContextPathEscapes
      - name: symlink-refused
        when: probe == symlink
        error: metaharness.workspace.ContextSymlink
        summary: A tracked symbolic link is refused by openat2 with RESOLVE_BENEATH and RESOLVE_NO_SYMLINKS.
      - name: irregular-file-refused
        when: probe == irregular
        error: metaharness.workspace.ContextNotRegularFile
      - name: untracked-file-refused
        when: probe == untracked
        error: metaharness.workspace.ContextUntracked
      - name: count-cap-refused
        when: probe == over-count
        error: metaharness.workspace.ContextCountCap
        summary: Seventeen tracked files pass the count cap of sixteen.
      - name: byte-cap-refused
        when: probe == over-bytes
        error: metaharness.workspace.ContextByteCap
        summary: One tracked file of 65,536 bytes passes the byte cap once its rendered path is counted.
      - name: empty-path-refused
        when: probe == empty-path
        error: metaharness.workspace.ContextPathEmpty
        summary: An empty path names no file and is refused before anything is read.
      - name: non-utf8-path-refused
        when: probe == non-utf8-path
        error: metaharness.workspace.ContextPathNotUtf8
        summary: A path that is not UTF-8 cannot be carried by the record or the prompt as text.
      - name: unreadable-file-refused
        when: probe == absent
        error: metaharness.workspace.ContextUnreadable
        summary: A file that is not there is refused, never dropped from the list.
      - name: not-text-refused
        when: probe == not-text
        error: metaharness.workspace.ContextNotText
        summary: A tracked file whose bytes are not UTF-8 text without a NUL cannot travel as prompt text.
      - name: tracked-files-recorded
        emits: [metaharness.workspace.ContextFilesRecorded]
        payload: {metaharness.workspace.ContextFilesRecorded: {files: 2, kinds: 3, digests_match: true}}
        summary: Two tracked files in a --scratch-cwd copy whose .git is a gitfile are handed over by all three kinds, and session.started lists each with the digest of the tree's bytes.

events:
  - name: metaharness.workspace.ProcessWritePlanned
    fields:
      - {name: admitted, type: Boolean}
      - {name: count, type: Integer}
  - name: metaharness.workspace.ScratchCwdAttested
    fields:
      - {name: h7, type: metaharness.workspace.CwdAttestation}
      - {name: h11_imposed, type: Boolean}
      - {name: exit_code, type: Integer}
  - name: metaharness.workspace.ContextFilesRecorded
    fields:
      - {name: files, type: Integer}
      - {name: kinds, type: Integer}
      - {name: digests_match, type: Boolean}
