domain: metaharness.trace
summary: The trace-ir/1 session format this repository owns, observed through the production projection and the four production readers. trace-ir normalizes the sessions of every harness, Claude Code, Codex, b10x or another, into one form, so that what a session did can be understood - how much context it used, what it cost, how many turns it took and which tools it ran. Which tools ran is read after the pipes, wrappers and shell commands Claude Code and Codex add around a program are removed; a tool call is represented by its normalized operations, never left as the raw command.
# Owner: Atlas ADR 0096 point 7. Protocol design amendment a26
# (docs/design/metaharness-protocol-v0.1.md) names this file the owning
# specification of the document form; docs/design/runs-side-by-side-v0.1.md § 1
# (P1-P3, the twenty-row table of § 1.2, amendment a17's row 20) is the detail.
# Document shape: crates/metaharness-protocol/src/trace_ir.rs (TraceIrDocument,
# TraceIrEvent, MetaharnessBlock, IR_FORMAT, IR_ADAPTER, UNK_FAMILY, UNK_REASON,
# CLOSED_FAMILY, project_document, render). Families and the control-plane list:
# crates/metaharness-protocol/src/projection.rs (IrFamily, CONTROL_PLANE_EVENTS,
# ir_family). Wire names: crates/metaharness-protocol/src/framing.rs EVENT_NAMES.
# Completeness: crates/metaharness-protocol/src/event.rs stream_completeness.
# Every command below is a conformance observation over that production code,
# executed by crates/metaharness-aep/src/drive/ess_conformance.rs. None is a
# public CLI verb, and none re-implements the mapping: the family, the reason,
# the digest and the completeness verdict are read off the document the
# production writer emitted.
types:
  - name: metaharness.trace.WireEventKind
    kind: enum
    # The twenty names of framing.rs EVENT_NAMES. Spelled with "-" where the wire
    # spells "." because a guard reads "." as field access; rate_limit is the
    # wire's own spelling. The target maps "-" back to "." and nothing else.
    variants: [session-started, session-ended, step-entered, step-left, turn-started, turn-ended, text, thinking, thinking-estimate, injection, tool-requested, tool-decided, tool-result, usage, rate_limit, command-result, warning, opaque, auth-expired, stream-closed]
  - name: metaharness.trace.NodeFamily
    kind: enum
    # The ten IrFamily names (projection.rs) plus the two metaharness extensions
    # the writer adds over trace-ir/1: unk (UNK_FAMILY) and stream_closed
    # (CLOSED_FAMILY, amendment a17). unk is not opaque: opaque is the vendor
    # saying something the adapter could not read.
    variants: [session_start, run_outcome, assistant_text, assistant_thinking, thinking_estimate, synthetic_injection, tool_call, tool_result, rate_limit, opaque, unk, stream_closed]
  - name: metaharness.trace.SourceKind
    kind: enum
    # Input of the normalize and project-vendor-record commands: which committed
    # record is read and through which production reader. The four vendor names
    # are also the values `metaharness project --from` admits (amendment a28),
    # spelled one way in the verb, here and in DocumentHeader.source;
    # metaharness-event-stream is the stream the verb reads without the flag and
    # is not a --from. claude-code-session (amendment a63) is a Claude Code
    # session as stored on disk, read with the sub-agent files beside it by
    # metaharness_claude::SessionReader.
    variants: [claude-code-stream-json, codex-rollout, harness-json, claude-code-session, metaharness-event-stream]
  - name: metaharness.trace.Adapter
    kind: enum
    # The adapter id the opening node carries (session.started.adapter), as the
    # three readers write it: metaharness-claude, metaharness-codex and
    # metaharness-b10x ADAPTER_ID.
    variants: [claude, codex, b10x]
  - name: metaharness.trace.Node
    kind: struct
    fields:
      - {name: index, type: Integer}
      - {name: source_line, type: Integer}
      - {name: timestamp, type: Optional<String>, presence: null_when_absent}
      - {name: timestamp_ms, type: Optional<Integer>, presence: null_when_absent}
      - {name: family, type: metaharness.trace.NodeFamily}
    # TraceIrEvent. index is the document position a verdict cites; source_line
    # is the 1-based event-stream line and is total because one wire line is one
    # event. timestamp is the vendor's, verbatim; timestamp_ms is derived from it
    # and from nothing else (no clock is read). Both counters are unsigned in
    # production, so a lower bound here could never fail; what a view can decide
    # is stated on RetainedDocument against the opening node's values.
    # UNMAPPED: the node's kind payload, the event's own fields under the family
    # tag, has the IR's per-family field set (projection.rs required_ir_fields)
    # and is not re-declared here.
  - name: metaharness.trace.DocumentHeader
    kind: struct
    fields:
      - {name: format, type: String}
      - {name: transcript_digest, type: String}
      - {name: adapter, type: String}
      - {name: source, type: String}
    # format is the constant trace-ir/1 (IR_FORMAT); adapter is the constant
    # metaharness/project (IR_ADAPTER, distinct from the consumer's reader name);
    # transcript_digest is the SHA-256 of the file the document was made from:
    # the event stream's own bytes for a stream read off the wire (P3, a15
    # point 2), the vendor record's bytes under `metaharness project --from`
    # (amendment a28). source is MetaharnessBlock::source and says which:
    # the constant metaharness.event/1 for the wire, the SourceKind name for a
    # vendor record; ProjectVendorRecord below reads both by literal.
  - name: metaharness.trace.Census
    kind: struct
    fields:
      - {name: events_total, type: Integer}
      - {name: unk, type: Integer}
      - {name: stream_complete, type: Boolean}
    # MetaharnessBlock. events_total equals the node count by construction; unk
    # is the sum over unk_kinds; stream_complete is verified against the lines
    # read, never copied from the marker (a17). Both counts are unsigned, so
    # they are held to the document's own node and family counts on
    # RetainedDocument rather than to a bound that cannot fail.
  - name: metaharness.trace.FamilyCensus
    kind: struct
    fields:
      - {name: session_start, type: Integer}
      - {name: run_outcome, type: Integer}
      - {name: assistant_text, type: Integer}
      - {name: assistant_thinking, type: Integer}
      - {name: thinking_estimate, type: Integer}
      - {name: synthetic_injection, type: Integer}
      - {name: tool_call, type: Integer}
      - {name: tool_result, type: Integer}
      - {name: rate_limit, type: Integer}
      - {name: opaque, type: Integer}
      - {name: unk, type: Integer}
      - {name: stream_closed, type: Integer}
    # MetaharnessBlock::families, one count per family, zero where absent.
  - name: metaharness.trace.NodeCount
    kind: struct
    fields:
      - {name: nodes, type: Integer}
      - {name: lines, type: Integer}
    invariants: [nodes >= 1, lines >= 1]
    # nodes is the retained document's node count; lines the committed
    # stream's line count. Both at least one: a run has an opening record.
  - name: metaharness.trace.RetainedDocument
    kind: struct
    fields:
      - {name: header, type: metaharness.trace.DocumentHeader}
      - {name: census, type: metaharness.trace.Census}
      - {name: families, type: metaharness.trace.FamilyCensus}
      - {name: counts, type: metaharness.trace.NodeCount}
      - {name: opening_node, type: metaharness.trace.Node}
      - {name: opening_timestamp_present, type: Boolean}
      - {name: byte_stable, type: Boolean}
      - {name: golden_stable, type: Boolean}
    invariants:
      - counts.nodes == counts.lines
      - byte_stable == true
      - golden_stable == true
      - opening_node.index == 0
      - opening_node.source_line == 1
      - opening_timestamp_present == true
      - census.events_total == counts.nodes
      - census.unk == families.unk
      - families.session_start == 1
      - families.stream_closed == 1
    # Read back from the retained document and from the committed stream it
    # names (MetaharnessBlock::run): nodes is the document's node count, lines
    # the stream's line count (P2, every event is a node), opening_node the
    # document's first node (index 0 on line 1, carrying the vendor's recorded
    # timestamp), byte_stable whether a fresh projection of the same stream
    # renders to the retained bytes (P1, one build), golden_stable whether that
    # render is the committed evals/aep/runs/<run>.trace-ir.json byte for byte
    # (P1 across builds; crates/metaharness-cli/tests/project.rs regenerates the
    # golden). The census is held to the document it summarizes: events_total
    # to the node count, unk to the unk family count; a recorded run opens with
    # one session_start node and ends with one stream_closed node. The opening
    # timestamp's millisecond value differs per run and is pinned by literal on
    # each ProjectRecordedRun outcome below. Every invariant compares values
    # the view reads; none is a bound an unsigned counter satisfies by type.
  - name: metaharness.trace.MarkerEvidence
    kind: enum
    # Every shape stream_completeness (event.rs) decides between, one variant
    # each: no marker (Truncated); a marker that is last and counts the nodes
    # before it (Complete); and the three Inconsistent causes it names, a marker
    # that is not the last line, a last marker whose count is wrong, and more
    # than one marker.
    variants: [absent, last-and-counting, misplaced, miscounting, duplicated]
  - name: metaharness.trace.VendorReference
    kind: enum
    # Whether session.started carried a vendor transcript digest.
    variants: [digest-named, digest-absent]
  - name: metaharness.trace.RecordedRun
    kind: enum
    # The two committed metaharness.event/1 streams under evals/aep/runs/
    # (16 and 14 lines; evals/aep/runs/README.md: hand-written inputs, not a
    # model's). Reading them in the gate is not a paid run (invariant 5).
    variants: [decomposer-clean, plan-reviewer-clean]
  - name: metaharness.trace.SummarizedToolCall
    kind: struct
    fields:
      - {name: call_id, type: Optional<String>, presence: null_when_absent}
      - {name: name, type: Optional<String>, presence: null_when_absent}
      - {name: tools, type: Optional<List<Optional<String>>>, presence: null_when_absent}
      - {name: answered, type: Boolean}
      - {name: error, type: Optional<Boolean>, presence: null_when_absent}
    # Amendment a69: name is the harness tool that carried the call (Bash,
    # exec_command, Read), kept as provenance; tools is what the call ran, the
    # tool of each of the node's semantic_operations that is not a container
    # and not glue, in order, null for an operation whose program could not be
    # read; null itself when the node carries no semantic_operations.
    # Amendment a42 point 2: one entry per tool_call node, in document order.
    # call_id and name are the node's own keys; answered is whether a
    # tool_result node carries the same call_id; error is the first such node's
    # is_error, null both when nothing answered the call and when the result
    # did not say (answered keeps the two apart).
    # crates/metaharness-protocol/src/trace_summary.rs SummarizedToolCall.
  - name: metaharness.trace.TokensBasis
    kind: enum
    # Amendment a42 point 3: which nodes the summary's four token counts were
    # read from. session: the terminal node's usage is an object, its totals
    # taken as written. sum-of-requests: there is a terminal node, its usage is
    # not an object, and at least one request node's (the usage fold, no
    # num_turns) is; each count sums the request nodes stating that key. The
    # summary renders null when there is no terminal node or no usage object
    # at all. crates/metaharness-protocol/src/trace_summary.rs TokensBasis.
    variants: [session, sum-of-requests]
  - name: metaharness.trace.SummarizedModel
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: input_tokens, type: Optional<Integer>, presence: null_when_absent}
      - {name: output_tokens, type: Optional<Integer>, presence: null_when_absent}
      - {name: cache_read_input_tokens, type: Optional<Integer>, presence: null_when_absent}
      - {name: cache_creation_input_tokens, type: Optional<Integer>, presence: null_when_absent}
    # Amendment a42 point 2: one entry per model name the document carries, in
    # first-seen order without repeats, read from session_start and run_outcome
    # nodes: the node's model, its model_usage keys, its observed_models
    # entries' model. The figures are the terminal node's model_usage[name]
    # figures, null where the document states none per model; a request node's
    # usage is never attributed to its model.
    # UNMAPPED: cost_usd (that model_usage entry's cost_usd, rendered last) is
    # a finite Binary64, refused in this projection (ESS-AUTHOR-036). Its type
    # is metaharness.monetary.SummaryCost, as SessionSummary's cost_usd is.
    # crates/metaharness-protocol/src/trace_summary.rs SummarizedModel.
  - name: metaharness.trace.SummarizedCount
    kind: struct
    fields:
      - {name: name, type: Optional<String>, presence: null_when_absent}
      - {name: operations, type: Integer}
    # Amendment a69: how many operations of the document's tool calls name one
    # normalized tool (SessionSummary tools) or one semantic kind
    # (operation_kinds), most first, then by name; a null name counts the
    # operations whose program could not be read. A shell tool such as Bash or
    # exec_command is never a name here; the programs it ran are.
    # crates/metaharness-protocol/src/trace_summary.rs SummarizedCount.
  - name: metaharness.trace.SessionSummary
    kind: struct
    fields:
      - {name: format, type: String}
      - {name: source, type: String}
      - {name: transcript_digest, type: String}
      - {name: adapter, type: Optional<String>, presence: null_when_absent}
      - {name: model, type: Optional<String>, presence: null_when_absent}
      - {name: models, type: List<metaharness.trace.SummarizedModel>}
      - {name: turns, type: Optional<Integer>, presence: null_when_absent}
      - {name: tokens_basis, type: Optional<metaharness.trace.TokensBasis>, presence: null_when_absent}
      - {name: input_tokens, type: Optional<Integer>, presence: null_when_absent}
      - {name: output_tokens, type: Optional<Integer>, presence: null_when_absent}
      - {name: cache_read_input_tokens, type: Optional<Integer>, presence: null_when_absent}
      - {name: cache_creation_input_tokens, type: Optional<Integer>, presence: null_when_absent}
      - {name: duration_ms, type: Optional<Integer>, presence: null_when_absent}
      - {name: duration_api_ms, type: Optional<Integer>, presence: null_when_absent}
      - {name: first_timestamp_ms, type: Optional<Integer>, presence: null_when_absent}
      - {name: last_timestamp_ms, type: Optional<Integer>, presence: null_when_absent}
      - {name: is_error, type: Optional<Boolean>, presence: null_when_absent}
      - {name: stop_reason, type: Optional<String>, presence: null_when_absent}
      - {name: tool_calls, type: List<metaharness.trace.SummarizedToolCall>}
      - {name: tools, type: Optional<List<metaharness.trace.SummarizedCount>>, presence: null_when_absent}
      - {name: operation_kinds, type: Optional<List<metaharness.trace.SummarizedCount>>, presence: null_when_absent}
      - {name: unk, type: Integer}
    # trace-ir-summary/1 (amendment a42), TraceIrSummary in
    # crates/metaharness-protocol/src/trace_summary.rs, rendered in this field
    # order. format is the constant trace-ir-summary/1 (SUMMARY_FORMAT); source
    # and transcript_digest are the document's own (DocumentHeader). adapter and
    # model are the opening session_start node's; models is every model the
    # document names (SummarizedModel). turns, the durations, is_error and
    # stop_reason are the terminal node's: the last run_outcome node carrying
    # num_turns, which session.ended always writes and the usage fold never
    # does. The four token counts are read as tokens_basis says: the terminal
    # node's usage totals (session), or, only when the terminal node carries no
    # usage object, the sum over the request nodes (sum-of-requests). No
    # normalization: input_tokens excludes cached input on Claude and includes
    # it on Codex, and is unverified on b10x (a42 point 3). The timestamps are
    # the first and last non-null node timestamp_ms. unk is the sum of
    # metaharness.unk_kinds. A value the document does not state is null, never
    # 0 or "" (invariant 3).
    # UNMAPPED: cost_usd (the terminal node's total_cost_usd, rendered between
    # cache_creation_input_tokens and duration_ms) is a finite Binary64, which
    # ESS 0.67.0 refuses in the core conformance projection (ESS-AUTHOR-036). Its
    # type is metaharness.monetary.SummaryCost in spec/monetary/observations.yaml.
  - name: metaharness.trace.OperationEvidence
    kind: enum
    # observed: the logged invocation itself; declared: what its input says it runs.
    variants: [observed, declared]
  - name: metaharness.trace.OperationResolution
    kind: enum
    variants: [classified, partial, unsupported]
  - name: metaharness.trace.OperationActivity
    kind: enum
    variants: [inspect, change, verify, research, wait, coordinate, unknown]
  - name: metaharness.trace.SemanticOperation
    kind: struct
    fields:
      - {name: parent, type: Optional<Integer>, presence: null_when_absent}
      - {name: kind, type: String}
      - {name: method, type: String}
      - {name: tool, type: Optional<String>, presence: null_when_absent}
      - {name: executable, type: Optional<String>, presence: null_when_absent}
      - {name: script, type: Optional<String>, presence: null_when_absent}
      - {name: wrappers, type: List<String>}
      - {name: evidence, type: metaharness.trace.OperationEvidence}
      - {name: resolution, type: metaharness.trace.OperationResolution}
      - {name: activity, type: metaharness.trace.OperationActivity}
      - {name: container, type: Boolean}
      - {name: signature, type: Optional<String>, presence: null_when_absent}
      - {name: start, type: Integer}
      - {name: end, type: Integer}
    # Amendment a68: one entry of a tool_call node's semantic_operations list,
    # crates/metaharness-semantic/src/extract.rs Node, written by
    # metaharness_semantic::annotate under the rule the document names in
    # metaharness.semantic_rule. The field set is context-lens's (MIT) plus
    # tool (amendment a69: the normalized tool the operation ran, the
    # executable for a command and the native tool's name for a native call,
    # never the shell or script tool that carried it; null for a container, a
    # builtin that only changes the shell's state such as cd, and an operation
    # whose program could not be read), executable (the basename of argv[0]
    # after the wrappers env, timeout,
    # xargs, sudo, nice, nohup and time are unwrapped), script (the basename of
    # the script a command runs) and wrappers (outermost first). kind is the
    # source's open vocabulary (file.read, stream.select, vcs.status,
    # validation.test, ...) for an operation and sequence, pipeline,
    # conditional, loop, parallel or wrapper for a container; a dotted word is
    # a String here because a guard reads "." as field access. parent is the
    # index of the enclosing container in the same list. start and end are byte
    # offsets into the decoded source domain.
    # UNMAPPED: params, the kind's parameters (paths, hashed patterns, argv_hash,
    # source_domain), is an object whose keys vary per kind.
  - name: metaharness.trace.CommandShape
    kind: enum
    # One synthetic tool call per shape (ExtractOperations); no transcript.
    variants: [native-read, pipeline-read, sequence, shell-unwrap, env-unwrap, timeout-unwrap, xargs-unwrap, sudo-unwrap, nice-unwrap, nohup-unwrap, time-unwrap, nested-wrappers, script-path, interpreter-script, codex-javascript, malformed-shell, pattern-withheld]
  - name: metaharness.trace.ToolCallShape
    kind: enum
    # One synthetic tool call per shape (ReadNormalizedTools, amendment a69); no transcript.
    variants: [shell-programs, wrapped-shell, codex-exec, native-call, unreadable-shell]

commands:
  - name: metaharness.trace.ClassifyEventKind
    # One event of the named kind, framed and given to project_document; the
    # family is read off the node the production writer emitted. One outcome
    # per family. The eight unk kinds are the control-plane list minus
    # stream.closed (projection.rs CONTROL_PLANE_EVENTS, a17); usage folds into
    # run_outcome (design § 4.3).
    input: [{name: kind, type: metaharness.trace.WireEventKind}]
    outcomes:
      - name: session-start
        when: kind == session-started
        emits: [metaharness.trace.FamilyClassified]
        payload: {metaharness.trace.FamilyClassified: {family: session_start}}
      - name: run-outcome
        when: {any: [kind == session-ended, kind == usage]}
        emits: [metaharness.trace.FamilyClassified]
        payload: {metaharness.trace.FamilyClassified: {family: run_outcome}}
      - name: assistant-text
        when: kind == text
        emits: [metaharness.trace.FamilyClassified]
        payload: {metaharness.trace.FamilyClassified: {family: assistant_text}}
      - name: assistant-thinking
        when: kind == thinking
        emits: [metaharness.trace.FamilyClassified]
        payload: {metaharness.trace.FamilyClassified: {family: assistant_thinking}}
      - name: thinking-estimate
        when: kind == thinking-estimate
        emits: [metaharness.trace.FamilyClassified]
        payload: {metaharness.trace.FamilyClassified: {family: thinking_estimate}}
      - name: synthetic-injection
        when: kind == injection
        emits: [metaharness.trace.FamilyClassified]
        payload: {metaharness.trace.FamilyClassified: {family: synthetic_injection}}
      - name: tool-call
        when: kind == tool-requested
        emits: [metaharness.trace.FamilyClassified]
        payload: {metaharness.trace.FamilyClassified: {family: tool_call}}
      - name: tool-result
        when: kind == tool-result
        emits: [metaharness.trace.FamilyClassified]
        payload: {metaharness.trace.FamilyClassified: {family: tool_result}}
      - name: rate-limit
        when: kind == rate_limit
        emits: [metaharness.trace.FamilyClassified]
        payload: {metaharness.trace.FamilyClassified: {family: rate_limit}}
      - name: opaque
        when: kind == opaque
        emits: [metaharness.trace.FamilyClassified]
        payload: {metaharness.trace.FamilyClassified: {family: opaque}}
      - name: stream-closed
        when: kind == stream-closed
        emits: [metaharness.trace.FamilyClassified]
        payload: {metaharness.trace.FamilyClassified: {family: stream_closed}}
        summary: The completeness marker is a terminal node of its own, never unk (a17).
      # The eight unk kinds, one outcome each so that every one is driven and
      # observed; the node names its kind and says why (UNK_REASON). Seven are
      # guarded; the eighth, auth.expired, is the one kind no guard claims and is
      # the unguarded default, which ESS therefore drives with exactly that kind.
      # A default is kept on purpose: without one ESS requires the guards to
      # partition the input, and a guard-negate mutant of any classify outcome
      # is stillborn (ESS-COMMAND-004 overlap, ESS-COMMAND-005 uncovered input)
      # instead of audited.
      - name: unk-step-entered
        when: kind == step-entered
        emits: [metaharness.trace.UnkClassified]
        payload: {metaharness.trace.UnkClassified: {family: unk, reason: "no trace-ir/1 family"}}
      - name: unk-step-left
        when: kind == step-left
        emits: [metaharness.trace.UnkClassified]
        payload: {metaharness.trace.UnkClassified: {family: unk, reason: "no trace-ir/1 family"}}
      - name: unk-turn-started
        when: kind == turn-started
        emits: [metaharness.trace.UnkClassified]
        payload: {metaharness.trace.UnkClassified: {family: unk, reason: "no trace-ir/1 family"}}
      - name: unk-turn-ended
        when: kind == turn-ended
        emits: [metaharness.trace.UnkClassified]
        payload: {metaharness.trace.UnkClassified: {family: unk, reason: "no trace-ir/1 family"}}
      - name: unk-tool-decided
        when: kind == tool-decided
        emits: [metaharness.trace.UnkClassified]
        payload: {metaharness.trace.UnkClassified: {family: unk, reason: "no trace-ir/1 family"}}
      - name: unk-command-result
        when: kind == command-result
        emits: [metaharness.trace.UnkClassified]
        payload: {metaharness.trace.UnkClassified: {family: unk, reason: "no trace-ir/1 family"}}
      - name: unk-warning
        when: kind == warning
        emits: [metaharness.trace.UnkClassified]
        payload: {metaharness.trace.UnkClassified: {family: unk, reason: "no trace-ir/1 family"}}
      - name: unk-auth-expired
        emits: [metaharness.trace.UnkClassified]
        payload: {metaharness.trace.UnkClassified: {family: unk, reason: "no trace-ir/1 family"}}
        summary: The twentieth row and the default; auth.expired is the only kind the eighteen guards above leave, so this outcome is driven with it (amendment a1, Q13).

  - name: metaharness.trace.VerifyStreamCompleteness
    # A short stream built through the production EventStream (which writes the
    # marker; the miscounting and duplicated shapes alter the count or copy the
    # marker it wrote) and read back through project_document. complete is
    # MetaharnessBlock::stream_complete; markers the stream_closed family count;
    # marker_last whether the document's last node is the marker. Verified,
    # never copied: a marker that is present but does not add up is not complete.
    input: [{name: marker, type: metaharness.trace.MarkerEvidence}]
    outcomes:
      - name: complete
        when: marker == last-and-counting
        emits: [metaharness.trace.CompletenessVerified]
        payload: {metaharness.trace.CompletenessVerified: {markers: 1, marker_last: true, complete: true}}
      - name: inconsistent-misplaced
        when: marker == misplaced
        emits: [metaharness.trace.CompletenessVerified]
        payload: {metaharness.trace.CompletenessVerified: {markers: 1, marker_last: false, complete: false}}
        summary: A line after the marker is the appended-to file a17 refuses.
      - name: inconsistent-miscounting
        when: marker == miscounting
        emits: [metaharness.trace.CompletenessVerified]
        payload: {metaharness.trace.CompletenessVerified: {markers: 1, marker_last: true, complete: false}}
        summary: A last marker whose count disagrees with the nodes before it decides nothing.
      - name: inconsistent-duplicated
        when: marker == duplicated
        emits: [metaharness.trace.CompletenessVerified]
        payload: {metaharness.trace.CompletenessVerified: {markers: 2, marker_last: true, complete: false}}
        summary: A stream ends once; production writes one marker and a file can carry two.
      - name: truncated
        emits: [metaharness.trace.CompletenessVerified]
        payload: {metaharness.trace.CompletenessVerified: {markers: 0, marker_last: false, complete: false}}
        summary: No marker is never read as complete (invariant 3 applied to the file).

  - name: metaharness.trace.NameDigest
    # One session.started line, with or without a vendor transcript digest on
    # it, projected; over_stream_bytes is whether transcript_digest equals the
    # SHA-256 of the framed bytes given to project_document, source is the
    # header's metaharness.source, vendor_digest_named whether
    # metaharness.vendor_transcript carries a digest.
    input: [{name: vendor_reference, type: metaharness.trace.VendorReference}]
    outcomes:
      - name: stream-digest-beside-vendor-digest
        when: vendor_reference == digest-named
        emits: [metaharness.trace.DigestNamed]
        payload: {metaharness.trace.DigestNamed: {over_stream_bytes: true, source: "metaharness.event/1", vendor_digest_named: true}}
        summary: Two digests meaning two things, neither pretending to be the other (P3).
      - name: stream-digest-alone
        emits: [metaharness.trace.DigestNamed]
        payload: {metaharness.trace.DigestNamed: {over_stream_bytes: true, source: "metaharness.event/1", vendor_digest_named: false}}

  - name: metaharness.trace.ProjectRecordedRun
    # Project one committed recorded stream, render it twice, and retain the
    # rendered document as an immutable record. nodes and unk are read off the
    # document; stream_complete is the verified a17 flag; byte_stable is whether
    # the two renders are the same bytes (P1).
    input: [{name: run, type: metaharness.trace.RecordedRun}]
    outcomes:
      - name: decomposer-clean-recorded
        when: run == decomposer-clean
        creates: metaharness.trace.ProjectionRecord
        instance: record_id
        emits: [metaharness.trace.ProjectionRecorded]
        payload: {metaharness.trace.ProjectionRecorded: {record_id: {generated: true}, nodes: 16, unk: 0, stream_complete: true, byte_stable: true, opening_timestamp_ms: 1787302800000}}
      - name: plan-reviewer-clean-recorded
        creates: metaharness.trace.ProjectionRecord
        instance: record_id
        emits: [metaharness.trace.ProjectionRecorded]
        payload: {metaharness.trace.ProjectionRecorded: {record_id: {generated: true}, nodes: 14, unk: 0, stream_complete: true, byte_stable: true, opening_timestamp_ms: 1787304000000}}
    # The counts are the committed streams' line counts, which
    # crates/metaharness-claude/tests/recorded_runs.rs holds byte for byte; a
    # change there is deliberate and moves these literals with it. The opening
    # timestamps are the streams' first lines, 2026-08-21T09:00:00.000Z and
    # 2026-08-21T09:20:00.000Z, as milliseconds since the epoch: derived from
    # the recorded string and from no clock (a15; trace_ir.rs parse_timestamp_ms).

  - name: metaharness.trace.NormalizeRecord
    # Each committed golden vendor record through its production reader
    # (metaharness_claude::TranscriptReader via metaharness::ClaudeSeams,
    # metaharness_codex::RolloutReader, metaharness_b10x::B10xSeams), framed by
    # the production EventStream, then project_document; the recorded
    # metaharness.event/1 stream is the fourth source and needs no reader.
    # reader_applied is observed: false when the record's first line already
    # parses as metaharness.event/1. adapter is the opening node's own adapter
    # field; opening_family that node's family.
    input: [{name: source, type: metaharness.trace.SourceKind}]
    outcomes:
      - name: claude-transcript-normalized
        when: source == claude-code-stream-json
        emits: [metaharness.trace.RecordNormalized]
        payload: {metaharness.trace.RecordNormalized: {adapter: claude, reader_applied: true, opening_family: session_start}}
      - name: codex-rollout-normalized
        when: source == codex-rollout
        emits: [metaharness.trace.RecordNormalized]
        payload: {metaharness.trace.RecordNormalized: {adapter: codex, reader_applied: true, opening_family: session_start}}
      - name: harness-record-normalized
        when: source == harness-json
        emits: [metaharness.trace.RecordNormalized]
        payload: {metaharness.trace.RecordNormalized: {adapter: b10x, reader_applied: true, opening_family: session_start}}
      - name: claude-session-normalized
        when: source == claude-code-session
        emits: [metaharness.trace.RecordNormalized]
        payload: {metaharness.trace.RecordNormalized: {adapter: claude, reader_applied: true, opening_family: session_start}}
        # The same payload as claude-transcript-normalized: both Claude readers
        # write adapter claude. The target tells the two apart by an observed
        # fact on the opening node, never by the input: a stream-json opening
        # is the vendor's system/init and lists offered_tools, and a session
        # file records no such list, so its opening states none (amendment a63).
      - name: event-stream-projected
        emits: [metaharness.trace.RecordNormalized]
        payload: {metaharness.trace.RecordNormalized: {adapter: claude, reader_applied: false, opening_family: session_start}}
    # Inputs: crates/metaharness-claude/fixtures/golden/transcript.jsonl,
    # crates/metaharness-claude/fixtures/golden/session/5e551011-0000-4000-8000-000000000001.jsonl
    # with its sub-agent file (hand-written, story:session-jsonl-adapter),
    # crates/metaharness-codex/fixtures/golden/rollout.jsonl,
    # crates/metaharness-b10x/fixtures/golden/loop.jsonl (read as it stands;
    # story:b10x-adapter-on-harness-over-llm re-records it later and no count
    # of its nodes is declared here), evals/aep/runs/decomposer-clean.events.jsonl.
    # Reading a vendor record through `metaharness project --from` itself is
    # ProjectVendorRecord below (amendment a28).

  - name: metaharness.trace.ProjectVendorRecord
    # Amendment a28: the public verb's library entry,
    # metaharness::project_vendor_record (crates/metaharness/src/viewer.rs),
    # over each committed golden vendor record named under NormalizeRecord,
    # called twice. Every value is read off the rendered document and off the
    # record: source is metaharness.source; adapter and opening_family are the
    # opening node's own; hermetic_mode and imposed are the metaharness.hermetic
    # block's (a replay claims nothing); stream_complete is the verified a17
    # flag (nobody closes a replayed stream, so it is false); byte_stable is
    # whether the two renders agree; digest_over_record whether
    # transcript_digest is the SHA-256 of the record's bytes; census_as_expected
    # whether metaharness.families equals the families of the adapter's own
    # committed expected stream projected through project_document (neither
    # carries a marker). The outcome is named from the opening node's adapter
    # and, for the two Claude readers, from metaharness.source, never from the
    # input. The default is reached by the one SourceKind that is
    # not a --from: the event stream is what `project` reads without the flag,
    # and the entry refuses the name, naming it (exit 2 at the verb). A default
    # is kept for ClassifyEventKind's reason: without one every guard-negate
    # mutant of this command is stillborn instead of audited.
    input: [{name: source, type: metaharness.trace.SourceKind}]
    outcomes:
      - name: claude-transcript-projected
        when: source == claude-code-stream-json
        emits: [metaharness.trace.VendorRecordProjected]
        payload: {metaharness.trace.VendorRecordProjected: {source: "claude-code-stream-json", adapter: claude, opening_family: session_start, hermetic_mode: "off", imposed: 0, stream_complete: false, byte_stable: true, digest_over_record: true, census_as_expected: true}}
      - name: codex-rollout-projected
        when: source == codex-rollout
        emits: [metaharness.trace.VendorRecordProjected]
        payload: {metaharness.trace.VendorRecordProjected: {source: "codex-rollout", adapter: codex, opening_family: session_start, hermetic_mode: "off", imposed: 0, stream_complete: false, byte_stable: true, digest_over_record: true, census_as_expected: true}}
      - name: harness-record-projected
        when: source == harness-json
        emits: [metaharness.trace.VendorRecordProjected]
        payload: {metaharness.trace.VendorRecordProjected: {source: "harness-json", adapter: b10x, opening_family: session_start, hermetic_mode: "off", imposed: 0, stream_complete: false, byte_stable: true, digest_over_record: true, census_as_expected: true}}
      - name: claude-session-projected
        when: source == claude-code-session
        emits: [metaharness.trace.VendorRecordProjected]
        payload: {metaharness.trace.VendorRecordProjected: {source: "claude-code-session", adapter: claude, opening_family: session_start, hermetic_mode: "off", imposed: 0, stream_complete: false, byte_stable: true, digest_over_record: true, census_as_expected: true}}
        # digest_over_record is over the session file's bytes only; each
        # sub-agent block's VENDOR_SUBAGENT warning names its own file's digest
        # (amendment a63).
      - name: event-stream-is-not-a-from
        emits: [metaharness.trace.VendorSourceRefused]
        payload: {metaharness.trace.VendorSourceRefused: {refused: true, names_the_source: true}}
        summary: The event stream is read without --from; its name as a --from is refused by name, with the four admitted names (a28 point 1).
    # UNMAPPED: that a record other than the four goldens opens with
    # session.started under its reader is not claimed here; a record that does
    # not is refused by the verb (a28 point 4) and pinned per cross pair in
    # crates/metaharness-cli/tests/project.rs and project_session.rs, not driven
    # by this suite.

  - name: metaharness.trace.SummarizeRecord
    # Amendment a42: `metaharness project --to trace-ir-summary`, observed
    # through its library entries. A vendor SourceKind is read by
    # metaharness::project_vendor_record (crates/metaharness/src/viewer.rs) over
    # the golden record NormalizeRecord names; the event stream is read by
    # metaharness::project_file over evals/aep/runs/decomposer-clean.events.jsonl,
    # as the verb reads it without --from. The document is summarized by
    # metaharness_protocol::summarize twice and rendered by
    # TraceIrSummary::render. Every field below except byte_stable is the compact
    # JSON text of the rendered summary's field of the same name, taken from a
    # parse of the rendered bytes and never from the typed summary: a string
    # keeps its quotes, an absent value is the text null, and a nested object's
    # keys come in serde_json's sorted order (the render's own key order is
    # pinned by crates/metaharness-cli/tests/project.rs). ESS 0.67.0 admits no
    # null payload literal (ESS-COMMAND-002) and no Binary64 in this projection
    # (ESS-AUTHOR-036), and the text is what tells null from 0 byte for byte.
    # byte_stable is whether the two renders agree. The outcome is named from
    # the summary's own source, never from the input: metaharness.event/1 is
    # the event stream, the default. Each vendor outcome pins at least one null
