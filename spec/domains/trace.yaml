  - name: metaharness.trace.ExtractOperations
    # Amendment a68. One synthetic call per CommandShape, framed by the
    # production EventStream after a session.started naming the adapter and
    # cwd /repo, written to a file and read by metaharness::project_file twice,
    # the writer behind `metaharness project`. Every String is the compact JSON
    # text of a list read off the rendered document's tool_call node's
    # semantic_operations: kinds, methods, executables, wrappers and scripts
    # one entry per operation (container false), containers one entry per
    # container, all in document order. semantic_rule is the compact JSON text
    # of metaharness.semantic_rule; byte_stable whether the two renders agree.
    input: [{name: shape, type: metaharness.trace.CommandShape}]
    outcomes:
      - name: native-read
        when: shape == native-read
        summary: 'Claude Read {"file_path": "/repo/src/lib.rs"}: a native tool is one operation and runs no executable.'
        emits: [metaharness.trace.OperationsExtracted]
        payload: {metaharness.trace.OperationsExtracted: {semantic_rule: '"metaharness-semantic/1"', kinds: '["file.read"]', methods: '["native"]', executables: '[null]', containers: '[]', wrappers: '[[]]', scripts: '[null]', byte_stable: true}}
      - name: pipeline-read
        when: shape == pipeline-read
        summary: 'Bash "cat src/lib.rs | head -n 3": one operation per command, inside the pipeline.'
        emits: [metaharness.trace.OperationsExtracted]
        payload: {metaharness.trace.OperationsExtracted: {semantic_rule: '"metaharness-semantic/1"', kinds: '["file.read","stream.select"]', methods: '["cat","head"]', executables: '["cat","head"]', containers: '["wrapper","pipeline"]', wrappers: '[[],[]]', scripts: '[null,null]', byte_stable: true}}
      - name: sequence
        when: shape == sequence
        summary: 'Bash "git status && cargo test": an and-list is a conditional around both commands.'
        emits: [metaharness.trace.OperationsExtracted]
        payload: {metaharness.trace.OperationsExtracted: {semantic_rule: '"metaharness-semantic/1"', kinds: '["vcs.status","validation.test"]', methods: '["git","cargo"]', executables: '["git","cargo"]', containers: '["wrapper","conditional"]', wrappers: '[[],[]]', scripts: '[null,null]', byte_stable: true}}
      - name: shell-unwrap
        when: shape == shell-unwrap
        summary: "Bash \"bash -c 'git diff'\": the inner shell is a wrapper and its command is read."
        emits: [metaharness.trace.OperationsExtracted]
        payload: {metaharness.trace.OperationsExtracted: {semantic_rule: '"metaharness-semantic/1"', kinds: '["vcs.diff"]', methods: '["git"]', executables: '["git"]', containers: '["wrapper","wrapper"]', wrappers: '[[]]', scripts: '[null]', byte_stable: true}}
      - name: env-unwrap
        when: shape == env-unwrap
        summary: 'Bash "env RUST_LOG=debug cargo test".'
        emits: [metaharness.trace.OperationsExtracted]
        payload: {metaharness.trace.OperationsExtracted: {semantic_rule: '"metaharness-semantic/1"', kinds: '["validation.test"]', methods: '["cargo"]', executables: '["cargo"]', containers: '["wrapper"]', wrappers: '[["env"]]', scripts: '[null]', byte_stable: true}}
      - name: timeout-unwrap
        when: shape == timeout-unwrap
        summary: 'Bash "timeout 60 cargo build".'
        emits: [metaharness.trace.OperationsExtracted]
        payload: {metaharness.trace.OperationsExtracted: {semantic_rule: '"metaharness-semantic/1"', kinds: '["validation.build"]', methods: '["cargo"]', executables: '["cargo"]', containers: '["wrapper"]', wrappers: '[["timeout"]]', scripts: '[null]', byte_stable: true}}
      - name: xargs-unwrap
        when: shape == xargs-unwrap
        summary: 'Bash "xargs rg -l needle": the files come from standard input, so the search is over files.'
        emits: [metaharness.trace.OperationsExtracted]
        payload: {metaharness.trace.OperationsExtracted: {semantic_rule: '"metaharness-semantic/1"', kinds: '["file.search"]', methods: '["rg"]', executables: '["rg"]', containers: '["wrapper"]', wrappers: '[["xargs"]]', scripts: '[null]', byte_stable: true}}
      - name: sudo-unwrap
        when: shape == sudo-unwrap
        summary: 'Bash "sudo -u build git status".'
        emits: [metaharness.trace.OperationsExtracted]
        payload: {metaharness.trace.OperationsExtracted: {semantic_rule: '"metaharness-semantic/1"', kinds: '["vcs.status"]', methods: '["git"]', executables: '["git"]', containers: '["wrapper"]', wrappers: '[["sudo"]]', scripts: '[null]', byte_stable: true}}
      - name: nice-unwrap
        when: shape == nice-unwrap
        summary: 'Bash "nice -n 10 cargo clippy".'
        emits: [metaharness.trace.OperationsExtracted]
        payload: {metaharness.trace.OperationsExtracted: {semantic_rule: '"metaharness-semantic/1"', kinds: '["validation.lint"]', methods: '["cargo"]', executables: '["cargo"]', containers: '["wrapper"]', wrappers: '[["nice"]]', scripts: '[null]', byte_stable: true}}
      - name: nohup-unwrap
        when: shape == nohup-unwrap
        summary: 'Bash "nohup cargo build".'
        emits: [metaharness.trace.OperationsExtracted]
        payload: {metaharness.trace.OperationsExtracted: {semantic_rule: '"metaharness-semantic/1"', kinds: '["validation.build"]', methods: '["cargo"]', executables: '["cargo"]', containers: '["wrapper"]', wrappers: '[["nohup"]]', scripts: '[null]', byte_stable: true}}
      - name: time-unwrap
        when: shape == time-unwrap
        summary: 'Bash "time cargo test".'
        emits: [metaharness.trace.OperationsExtracted]
        payload: {metaharness.trace.OperationsExtracted: {semantic_rule: '"metaharness-semantic/1"', kinds: '["validation.test"]', methods: '["cargo"]', executables: '["cargo"]', containers: '["wrapper"]', wrappers: '[["time"]]', scripts: '[null]', byte_stable: true}}
      - name: nested-wrappers
        when: shape == nested-wrappers
        summary: 'Bash "sudo timeout 5 env A=1 git log": wrappers unwrap outermost first.'
        emits: [metaharness.trace.OperationsExtracted]
        payload: {metaharness.trace.OperationsExtracted: {semantic_rule: '"metaharness-semantic/1"', kinds: '["vcs.inspect"]', methods: '["git"]', executables: '["git"]', containers: '["wrapper"]', wrappers: '[["sudo","timeout","env"]]', scripts: '[null]', byte_stable: true}}
      - name: script-path
        when: shape == script-path
        summary: 'Bash "./scripts/check.sh --fast": a script run by path names its basename.'
        emits: [metaharness.trace.OperationsExtracted]
        payload: {metaharness.trace.OperationsExtracted: {semantic_rule: '"metaharness-semantic/1"', kinds: '["process.run"]', methods: '["shell_command"]', executables: '["check.sh"]', containers: '["wrapper"]', wrappers: '[[]]', scripts: '["check.sh"]', byte_stable: true}}
      - name: interpreter-script
        when: shape == interpreter-script
        summary: 'Bash "python3 tools/report.py --all": the interpreter is the executable, the script its operand.'
        emits: [metaharness.trace.OperationsExtracted]
        payload: {metaharness.trace.OperationsExtracted: {semantic_rule: '"metaharness-semantic/1"', kinds: '["process.run"]', methods: '["opaque_program"]', executables: '["python3"]', containers: '["wrapper"]', wrappers: '[[]]', scripts: '["report.py"]', byte_stable: true}}
      - name: codex-javascript
        when: shape == codex-javascript
        summary: 'Codex exec script calling tools.exec_command with "git status": the script and the shell are wrappers.'
        emits: [metaharness.trace.OperationsExtracted]
        payload: {metaharness.trace.OperationsExtracted: {semantic_rule: '"metaharness-semantic/1"', kinds: '["vcs.status"]', methods: '["git"]', executables: '["git"]', containers: '["wrapper","wrapper"]', wrappers: '[[]]', scripts: '[null]', byte_stable: true}}
      - name: malformed-shell
        when: shape == malformed-shell
        summary: "Bash \"cat 'oops\": a command that does not parse is one unsupported operation, never a read."
        emits: [metaharness.trace.OperationsExtracted]
        payload: {metaharness.trace.OperationsExtracted: {semantic_rule: '"metaharness-semantic/1"', kinds: '["other"]', methods: '["malformed_shell"]', executables: '[null]', containers: '["wrapper"]', wrappers: '[[]]', scripts: '[null]', byte_stable: true}}
      - name: pattern-withheld
        summary: "Bash \"rg -n 'sentinel pattern' src\": the pattern is hashed and its text is nowhere in the operations."
        emits: [metaharness.trace.ArgumentsWithheld]
        payload: {metaharness.trace.ArgumentsWithheld: {semantic_rule: '"metaharness-semantic/1"', kinds: '["file.search"]', pattern_stored: false, patterns_hashed: 1}}
    # The default is pattern-withheld, kept for ClassifyEventKind's reason:
    # without one every guard-negate mutant of this command is stillborn.

  - name: metaharness.trace.ReadNormalizedTools
    # Amendment a69: what a tool call ran is its normalized operation list, not
    # its raw command. One synthetic call per ToolCallShape, framed and
    # projected as ExtractOperations frames it, then summarized by
    # metaharness_protocol::summarize. node_tools is the compact JSON text of
    # the tool of every operation on the rendered tool_call node that is not a
    # container, read straight off the node's fields with no parse of any
    # string; call_tools is the summary's tool_calls[0].tools and summary_tools
    # the summary's tools, both off a parse of the summary's render.
    # carrier_counted is whether summary_tools names the call's own name (Bash,
    # exec_command, exec, Read): false for every shell or script call, true
    # only where a native tool is its own name. raw_input_read is whether the
    # summary's render changes when the node's input, the raw command kept as
    # provenance, is replaced by other text: no summary reads it.
    input: [{name: shape, type: metaharness.trace.ToolCallShape}]
    outcomes:
      - name: shell-programs
        when: shape == shell-programs
        summary: 'Bash "cd src && rg -n x . | head -n 3": the summary counts rg and head; cd is glue and Bash is no tool.'
        emits: [metaharness.trace.NormalizedToolsRead]
        payload: {metaharness.trace.NormalizedToolsRead: {node_tools: '[null,"rg","head"]', call_tools: '["rg","head"]', summary_tools: '[{"name":"head","operations":1},{"name":"rg","operations":1}]', carrier_counted: false, raw_input_read: false}}
      - name: wrapped-shell
        when: shape == wrapped-shell
        summary: "Bash \"timeout 60 bash -c 'git status && cargo test'\": the wrapper and the inner shell are unwrapped to git and cargo."
        emits: [metaharness.trace.NormalizedToolsRead]
        payload: {metaharness.trace.NormalizedToolsRead: {node_tools: '["git","cargo"]', call_tools: '["git","cargo"]', summary_tools: '[{"name":"cargo","operations":1},{"name":"git","operations":1}]', carrier_counted: false, raw_input_read: false}}
      - name: codex-exec
        when: shape == codex-exec
        summary: 'Codex exec script calling tools.exec_command with "git status" and tools.apply_patch: git and apply_patch, never exec or exec_command.'
        emits: [metaharness.trace.NormalizedToolsRead]
        payload: {metaharness.trace.NormalizedToolsRead: {node_tools: '["git","apply_patch"]', call_tools: '["git","apply_patch"]', summary_tools: '[{"name":"apply_patch","operations":1},{"name":"git","operations":1}]', carrier_counted: false, raw_input_read: false}}
      - name: native-call
        when: shape == native-call
        summary: 'Claude Read {"file_path": "/repo/src/lib.rs"}: a native tool is its own name.'
        emits: [metaharness.trace.NormalizedToolsRead]
        payload: {metaharness.trace.NormalizedToolsRead: {node_tools: '["Read"]', call_tools: '["Read"]', summary_tools: '[{"name":"Read","operations":1}]', carrier_counted: true, raw_input_read: false}}
      - name: unreadable-shell
        summary: "Bash \"cat 'oops\": a command that does not parse ran an unknown tool, counted as null and never as Bash."
        emits: [metaharness.trace.NormalizedToolsRead]
        payload: {metaharness.trace.NormalizedToolsRead: {node_tools: '[null]', call_tools: '[null]', summary_tools: '[{"name":null,"operations":1}]', carrier_counted: false, raw_input_read: false}}
    # The default is unreadable-shell, for the reason ExtractOperations keeps one.

# Conformance observations, not newly published runtime wire events.
events:
  - name: metaharness.trace.FamilyClassified
    fields: [{name: family, type: metaharness.trace.NodeFamily}]
  - name: metaharness.trace.UnkClassified
    fields:
      - {name: family, type: metaharness.trace.NodeFamily}
      - {name: reason, type: String}
  - name: metaharness.trace.CompletenessVerified
    fields:
      - {name: markers, type: Integer}
      - {name: marker_last, type: Boolean}
      - {name: complete, type: Boolean}
  - name: metaharness.trace.DigestNamed
    fields:
      - {name: over_stream_bytes, type: Boolean}
      - {name: source, type: String}
      - {name: vendor_digest_named, type: Boolean}
  - name: metaharness.trace.ProjectionRecorded
    fields:
      - {name: record_id, type: String}
      - {name: nodes, type: Integer}
      - {name: unk, type: Integer}
      - {name: stream_complete, type: Boolean}
      - {name: byte_stable, type: Boolean}
      - {name: opening_timestamp_ms, type: Integer}
  - name: metaharness.trace.RecordNormalized
    fields:
      - {name: adapter, type: metaharness.trace.Adapter}
      - {name: reader_applied, type: Boolean}
      - {name: opening_family, type: metaharness.trace.NodeFamily}
  - name: metaharness.trace.VendorRecordProjected
    fields:
      - {name: source, type: String}
      - {name: adapter, type: metaharness.trace.Adapter}
      - {name: opening_family, type: metaharness.trace.NodeFamily}
      - {name: hermetic_mode, type: String}
      - {name: imposed, type: Integer}
      - {name: stream_complete, type: Boolean}
      - {name: byte_stable, type: Boolean}
      - {name: digest_over_record, type: Boolean}
      - {name: census_as_expected, type: Boolean}
  - name: metaharness.trace.VendorSourceRefused
    fields:
      - {name: refused, type: Boolean}
      - {name: names_the_source, type: Boolean}
  - name: metaharness.trace.SessionSummarized
    # One String per metaharness.trace.SessionSummary field plus cost_usd, each
    # the field's compact JSON text in a parse of the production render
    # (SummarizeRecord).
    fields:
      - {name: format, type: String}
      - {name: source, type: String}
      - {name: transcript_digest, type: String}
      - {name: adapter, type: String}
      - {name: model, type: String}
      - {name: models, type: String}
      - {name: turns, type: String}
      - {name: tokens_basis, type: String}
      - {name: input_tokens, type: String}
      - {name: output_tokens, type: String}
      - {name: cache_read_input_tokens, type: String}
      - {name: cache_creation_input_tokens, type: String}
      # cost_usd, and each models entry's cost_usd inside models: the text is
      # the shortest spelling that round-trips the f64 the reader parsed, an
      # observation of rendered bytes and not an amount. The money type stays
      # metaharness.monetary.SummaryCost (spec/monetary/observations.yaml).
      - {name: cost_usd, type: String}
      - {name: duration_ms, type: String}
      - {name: duration_api_ms, type: String}
      - {name: first_timestamp_ms, type: String}
      - {name: last_timestamp_ms, type: String}
      - {name: is_error, type: String}
      - {name: stop_reason, type: String}
      - {name: tool_calls, type: String}
      - {name: tools, type: String}
      - {name: operation_kinds, type: String}
      - {name: unk, type: String}
      - {name: byte_stable, type: Boolean}
  - name: metaharness.trace.OperationsExtracted
    fields:
      - {name: semantic_rule, type: String}
      - {name: kinds, type: String}
      - {name: methods, type: String}
      - {name: executables, type: String}
      - {name: containers, type: String}
      - {name: wrappers, type: String}
      - {name: scripts, type: String}
      - {name: byte_stable, type: Boolean}
  - name: metaharness.trace.ArgumentsWithheld
    fields:
      - {name: semantic_rule, type: String}
      - {name: kinds, type: String}
      - {name: pattern_stored, type: Boolean}
      - {name: patterns_hashed, type: Integer}
  - name: metaharness.trace.NormalizedToolsRead
    fields:
      - {name: node_tools, type: String}
      - {name: call_tools, type: String}
      - {name: summary_tools, type: String}
      - {name: carrier_counted, type: Boolean}
      - {name: raw_input_read, type: Boolean}

# An immutable retained document, not a second run lifecycle.
entities:
  - name: metaharness.trace.ProjectionRecord
    identity: {name: record_id, type: String}
    fields: [{name: projection, type: metaharness.trace.RetainedDocument}]
    lifecycle: {initial: Recorded, states: [Recorded], terminal: [Recorded], transitions: []}
views:
  - name: metaharness.trace.RetainedProjection
    source: metaharness.trace.ProjectionRecord
    consistency: read_your_writes
    fields: [{name: projection, type: metaharness.trace.RetainedDocument}]
