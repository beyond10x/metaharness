domain: metaharness.session
summary: A bounded projection of Codex completion evidence and normalized stream closure.
# Existing wire types: crates/metaharness-protocol/src/event.rs:388,706,799.
# Required repair: docs/design/metaharness-protocol-v0.1.md, "Amendment a18 —
# terminal outcomes and selected workspaces (2026-10-03)". At the draft baseline,
# crates/metaharness-codex/src/rollout.rs:135,296 drops explicit failure evidence.
# These commands name adapter/run-loop operations for a real conformance target;
# they are not new public CLI verbs or a second vendor decoder.
types:
  - name: metaharness.session.SteeringProbe
    kind: enum
    variants: [quiet-halt, quiet-interrupt, pending-halt, quiet-only, quiet-wireless-interrupt]
  - name: metaharness.session.TerminalEvidence
    kind: struct
    fields:
      - {name: is_error, type: Optional<Boolean>, presence: null_when_absent}
      - {name: subtype, type: Optional<String>, presence: null_when_absent}
      - {name: stop_reason, type: Optional<String>, presence: null_when_absent}
      - {name: terminal_reason, type: Optional<String>, presence: null_when_absent}
    # UNMAPPED: the source's total_cost_usd: Option<f64> remains exact in the
    # separately validated monetary contract. ESS 0.66.0 refuses Binary64 in
    # conformance codecs and Rust synthesis; this projection excludes its value.
  - name: metaharness.session.CodexCompletion
    kind: struct
    fields:
      - {name: error, type: Optional<Json>, presence: null_when_absent}
      - {name: last_agent_message, type: Optional<String>, presence: null_when_absent}
    # The payload type alone cannot distinguish missing error from error:null.
    # The evidence discriminants below preserve that distinction for scenarios.
  - name: metaharness.session.ErrorProperty
    kind: enum
    variants: [missing, explicit-null, nonnull]
  - name: metaharness.session.LastMessageEvidence
    kind: enum
    variants: [missing-or-nonstring, blank, nonblank]
    # blank means String::trim().is_empty(), including whitespace-only strings.
    # These are raw-payload classes, not a caller-supplied success verdict.
  - name: metaharness.session.CompletionVerdict
    kind: enum
    variants: [success, failure, unknown]
  - name: metaharness.session.CloseReason
    kind: enum
    variants: [completed, budget, killed, error, steer-halt]
  - name: metaharness.session.StreamClosure
    kind: struct
    fields:
      - {name: run_id, type: String}
      - {name: events, type: Integer}
      - {name: reason, type: metaharness.session.CloseReason}
    invariants: [events >= 0]
  - name: metaharness.session.ChildExit
    kind: enum
    variants: [exited-zero, exited-nonzero, signaled, unknown]
    # The harness child's own exit as the audit's `child exit:` line names it
    # (amendment a48). unknown is a runner that measured nothing, never exit 0.
  - name: metaharness.session.OpeningRecord
    kind: enum
    variants: [complete, silent-on-plugins-and-mcp, off-the-pin, undeclared-plugin]
    # complete: every field the floor reads, on the adapter's pin. silent: no
    # plugin and no MCP server list, so H1a and H5 are unk. off-the-pin: the
    # version 0.0.0-off-the-pin, so H9 is gap and advisory and H11 is unk, no
    # memory canary being recorded for it (amendment a62). undeclared-plugin:
    # a plugin nobody declared, named with no <name>@builtin source, so H1a is
    # gap on any version; a62 reads only a <name>@builtin plugin on a version
    # with no built-in list as unk.
  - name: metaharness.session.VersionEvidence
    kind: enum
    variants: [pinned, off-the-pin, unreadable]
    # What a binary's `--version` told metaharness::qualify, before any session.
    # pinned: a version in the adapter's pin. off-the-pin: any other version.
    # unreadable: it failed, printed no version or did not exit in time. The
    # rows are the floor's own readings of the same version: H9 ok, gap and
    # unk, advisory on every kind (a62); H11, where the kind records a memory
    # canary, ok, unk (no canary recorded) and unk (no version), gating.
  - name: metaharness.session.Qualification
    kind: struct
    fields:
      - {name: evidence, type: metaharness.session.VersionEvidence}
      - {name: qualified, type: Boolean}
      - {name: strict_version_refuses, type: Boolean}
    # qualified: no row gates under the mode asked, which only strict does.
    # strict_version_refuses: the evidence is not pinned. The two differ on
    # purpose: an off-pin Codex binary is qualified and --strict-version
    # refuses it. UNMAPPED: held by crates/metaharness/tests/qualify.rs, which
    # runs a script standing in for the vendor, not by a generated scenario.
  - name: metaharness.session.ControlVerdict
    kind: enum
    variants: [ok, unk, gap]
  - name: metaharness.session.AuditVerdict
    kind: enum
    variants: [ok, gap, no-verdict]

commands:
  - name: metaharness.session.PollSteering
    # Production Run polling/control over a bounded synthetic process, not native timing.
    input: [{name: probe, type: metaharness.session.SteeringProbe}]
    outcomes:
      - name: quiet-native-halt
        when: probe == quiet-halt
        emits: [metaharness.session.PollingObserved]
        payload:
          metaharness.session.PollingObserved: {yielded: true, control_written: true, closed: true, deadline_advanced: false, process_killed: true}
      - name: quiet-native-interrupt
        when: probe == quiet-interrupt
        emits: [metaharness.session.PollingObserved]
        payload:
          metaharness.session.PollingObserved: {yielded: true, control_written: true, closed: false, deadline_advanced: false, process_killed: false}
      - name: pending-decision-steering
        when: probe == pending-halt
        emits: [metaharness.session.PollingObserved]
        payload:
          metaharness.session.PollingObserved: {yielded: true, control_written: true, closed: true, deadline_advanced: false, process_killed: true}
      - name: quiet-wireless-interrupt
        when: probe == quiet-wireless-interrupt
        emits: [metaharness.session.PollingObserved]
        payload:
          metaharness.session.PollingObserved: {yielded: true, control_written: false, closed: true, deadline_advanced: false, process_killed: true}
      - name: quiet-output-is-not-eof
        emits: [metaharness.session.PollingObserved]
        payload:
          metaharness.session.PollingObserved: {yielded: true, control_written: false, closed: false, deadline_advanced: false, process_killed: false}
  - name: metaharness.session.RecordClosedStream
    # Run the empty synthetic process through the production loop and retain its closure.
    input: []
    outcomes:
      - name: recorded
        creates: metaharness.session.ClosedStreamRecord
        instance: record_id
        emits: [metaharness.session.ClosureRecorded]
        payload: {metaharness.session.ClosureRecorded: {record_id: {generated: true}}}
  - name: metaharness.session.FinishCodexCompletion
    # Project the last native task_complete through the existing rollout reader.
    input:
      - {name: error_property, type: metaharness.session.ErrorProperty}
      - {name: last_message, type: metaharness.session.LastMessageEvidence}
    outcomes:
      - name: explicit-failure
        when: error_property == nonnull
        emits: [metaharness.session.CompletionClassified]
        payload:
          metaharness.session.CompletionClassified: {verdict: failure}
      - name: positive-completion
        when:
          any:
            - error_property == explicit-null
            - all: [error_property == missing, last_message == nonblank]
        emits: [metaharness.session.CompletionClassified]
        payload:
          metaharness.session.CompletionClassified: {verdict: success}
      - name: incomplete-evidence
        emits: [metaharness.session.CompletionClassified]
        payload:
          metaharness.session.CompletionClassified: {verdict: unknown}
        summary: Unknown maps to absent normalized is_error, not a fabricated vendor error.
    # UNMAPPED: absence of task_complete, error/turn.failed records outside this
    # payload, and preliminary text followed by failure need authored real-reader
    # sequences. See rollout.rs:99,135,271,286 and GitHub issue 11.
    # A real target constructs raw synthetic JSON from these shape classes, then
    # calls the reader; it must not implement the decision table itself. Source:
    # issue-11 repair's integrated RolloutReader completion_error helper.
    # UNMAPPED: exhaustive JSON payload shapes, failure sticky across later
    # completions, and a new task_started clearing prior success need raw-reader
    # sequence vectors. Unknown money remains absent (rollout.rs:150-152), not zero.

  - name: metaharness.session.CloseUnsteeredStream
    # Classify normalized terminal facts without fabricating success from absence.
    input:
      - {name: terminal_present, type: Boolean}
      - {name: is_error, type: Optional<Boolean>, presence: null_when_absent}
      - {name: subtype, type: Optional<String>, presence: null_when_absent}
      - {name: stop_reason, type: Optional<String>, presence: null_when_absent}
      - {name: terminal_reason, type: Optional<String>, presence: null_when_absent}
    outcomes:
      - name: observed-budget-stop
        when:
          all:
            - terminal_present == true
            - any:
                - coalesce(subtype, "") == "budget-exhausted"
                - coalesce(stop_reason, "") == "budget-exhausted"
                - coalesce(terminal_reason, "") == "budget-exhausted"
        emits: [metaharness.session.StreamClassified]
        payload:
          metaharness.session.StreamClassified: {reason: budget}
      - name: positive-terminal-record
        # Declared after observed-budget-stop, which takes a record carrying a budget
        # word first. An absent is_error is neither verdict: it is not true, and it is
        # not false, so only the legacy subtype success selects this branch then.
        when:
          all:
            - terminal_present == true
            - coalesce(is_error, false) == false
            - any:
                - coalesce(is_error, true) == false
                - coalesce(subtype, "") == "success"
        emits: [metaharness.session.StreamClassified]
        payload:
          metaharness.session.StreamClassified: {reason: completed}
      - name: failed-or-unknown-terminal
        emits: [metaharness.session.StreamClassified]
        payload:
          metaharness.session.StreamClassified: {reason: error}
    # Source: crates/metaharness/src/run.rs:1240-1267 (Run::reason_from_record),
    # clarified with issue-11's repair before integration: budget precedence, then
    # explicit is_error=true, then is_error=false or the legacy subtype success,
    # otherwise unknown/error. coalesce (ess/29) states what an absent optional field
    # compares as, so every terminal record, any optional field absent, is decided.
    # The unknown branch is the a18 repair, not a claim baseline code conforms.
    # UNMAPPED: steering precedence, final-line order/count and CLI
    # audited/unaudited agreement need real Run/CLI scenarios. The process exit
    # status is ExitAuditedRun below. The entity vocabulary is not expanded to
    # invent a second process/session lifecycle.

  - name: metaharness.session.ExitAuditedRun
    # Amendment a48: a real --hermetic strict Claude run over a declared scratch
    # copy, audited. The three verdict lines are read off AuditReport::render and
    # the exit code off Run::exit. A measured child is /bin/sh under the
    # production SpawnRunner; unknown is a runner that measures nothing. The
    # child decides no verdict, so every outcome holds for every child.
    input:
      - {name: child, type: metaharness.session.ChildExit}
      - {name: opening, type: metaharness.session.OpeningRecord}
    outcomes:
      - name: a-gating-row-failed
        when: opening == undeclared-plugin
        emits: [metaharness.session.AuditedRunExited]
        payload:
          metaharness.session.AuditedRunExited: {child_exit: input.child, control: gap, audit: gap, exit_code: 1}
      # Amendment a62: a version off the pin is reported, never refused. H9 reads
      # gap and is advisory; H11 is unk because nobody measured that binary.
      - name: an-off-pin-version-is-unmeasured
        when: opening == off-the-pin
        emits: [metaharness.session.AuditedRunExited]
        payload:
          metaharness.session.AuditedRunExited: {child_exit: input.child, control: unk, audit: no-verdict, exit_code: 3}
      - name: nobody-found-out
        when: opening == silent-on-plugins-and-mcp
        emits: [metaharness.session.AuditedRunExited]
        payload:
          metaharness.session.AuditedRunExited: {child_exit: input.child, control: unk, audit: no-verdict, exit_code: 3}
      - name: every-control-held
        emits: [metaharness.session.AuditedRunExited]
        payload:
          metaharness.session.AuditedRunExited: {child_exit: input.child, control: ok, audit: ok, exit_code: 0}
    # UNMAPPED: an auditor's own exit, which moves the audit verdict and never
    # the control verdict, and a run with no terminal record, which exits 3
    # beside a control verdict of ok. Both are held by
    # crates/metaharness/tests/audit.rs, not by a scenario.

# These are conformance observations, not newly published runtime wire events.
events:
  - name: metaharness.session.PollingObserved
    fields:
      - {name: process_killed, type: Boolean}
      - {name: yielded, type: Boolean}
      - {name: control_written, type: Boolean}
      - {name: closed, type: Boolean}
      - {name: deadline_advanced, type: Boolean}
  - name: metaharness.session.ClosureRecorded
    fields: [{name: record_id, type: String}]
  - name: metaharness.session.CompletionClassified
    fields: [{name: verdict, type: metaharness.session.CompletionVerdict}]
  - name: metaharness.session.StreamClassified
    fields: [{name: reason, type: metaharness.session.CloseReason}]
  - name: metaharness.session.AuditedRunExited
    fields:
      - {name: child_exit, type: metaharness.session.ChildExit}
      - {name: control, type: metaharness.session.ControlVerdict}
      - {name: audit, type: metaharness.session.AuditVerdict}
      - {name: exit_code, type: Integer}

# Immutable retained stream closure, not a second running-session lifecycle.
entities:
  - name: metaharness.session.ClosedStreamRecord
    identity: {name: record_id, type: String}
    fields: [{name: closure, type: metaharness.session.StreamClosure}]
    lifecycle: {initial: Recorded, states: [Recorded], terminal: [Recorded], transitions: []}
views:
  - name: metaharness.session.RetainedClosure
    source: metaharness.session.ClosedStreamRecord
    consistency: read_your_writes
    fields: [{name: closure, type: metaharness.session.StreamClosure}]
