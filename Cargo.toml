[workspace]
resolver = "3"
members = [
    "crates/metaharness",
    "crates/metaharness-protocol",
    "crates/metaharness-claude",
    "crates/metaharness-codex",
    "crates/metaharness-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/metaharness"
rust-version = "1.98"

# One version per dependency for the whole workspace, so two crates cannot disagree about the
# shape of a type they both put on the wire.
[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
