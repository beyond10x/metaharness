[workspace]
resolver = "3"
members = [
    "crates/metaharness",
    "crates/metaharness-protocol",
    "crates/metaharness-claude",
    "crates/metaharness-codex",
    "crates/metaharness-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/metaharness/metaharness"
rust-version = "1.98"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
